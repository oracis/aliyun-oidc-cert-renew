name: aliyun-oidc-cert-renew
display_name: 阿里云证书自动续期（免 AK）
version: 1.0.0
author: oracis
category: 开发编程
platforms:
  - WorkBuddy
  - Claude Code
  - Codex
license: MIT
homepage: https://github.com/oracis/aliyun-oidc-cert-renew
description: 用 GitHub Actions + 阿里云 RAM OIDC 自动续期 Let's Encrypt 通配证书并分发到 OSS/FC/CDN，仓库零长期 AK。覆盖 OIDC 提供商/角色/权限策略搭建、workflow 手动兑换临时 STS、ACME DNS-01 签发、CAS 上传复用、新子域 DNS 自动发现绑定、60 天 keepalive、状态持久化，以及 IMS/RAM/CAS/oss2 SDK 的全部命名坑。
triggers:
  - 自动续期证书
  - SSL 证书过期
  - 不想在 GitHub 存 AK
  - GitHub Actions 操作阿里云
  - 免密钥访问阿里云
  - 新增子域自动上 HTTPS
  - 通配证书申请
  - Let's Encrypt 自动续签
  - RAM OIDC 配置
  - renew SSL certificate
  - github actions aliyun oidc
tags:
  - 阿里云
  - GitHub Actions
  - OIDC
  - SSL证书
  - Let's Encrypt
  - 运维
  - 自动化
  - 免密钥
